<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Web Viewer</title>
  <script src="./config.js"></script>
  <script src="./vendor/aframe.min.js"></script>
  <script type="module" src="./vendor/mindar/mindar-image-aframe.prod.js"></script>
  <style>
    /* 배경은 html에만 — body에 칠하면 MindAR의 카메라 화면(z-index:-2)이 가려진다 */
    html { background: #000; }
    html, body { margin: 0; height: 100%; overflow: hidden; font-family: -apple-system, "Apple SD Gothic Neo", sans-serif; }
    #message {
      position: fixed; inset: 0; z-index: 10; display: none;
      align-items: center; justify-content: center; text-align: center;
      background: #111; color: #fff; padding: 24px; line-height: 1.7;
    }
    #splash {
      position: fixed; inset: 0; z-index: 20; display: flex;
      align-items: center; justify-content: center; flex-direction: column; gap: 18px;
      background: #111; color: #fff; text-align: center; padding: 24px;
    }
    #splash button {
      appearance: none; border: 0; border-radius: 999px; cursor: pointer;
      padding: 14px 32px; font-size: 16px; font-weight: 700;
      background: #fff; color: #111;
    }
    #splash .hint { font-size: 13px; opacity: .7; max-width: 260px; line-height: 1.6; }
    /* AR 씬(embedded)은 부모의 크기를 따른다. 이 컨테이너에 크기가 없으면
       캔버스 높이가 0이 되어 카메라 위에 영상이 그려지지 않는다. */
    #scene-root { position: fixed; inset: 0; }
    #scene-root .a-canvas { display: block; }

    /* 조작 버튼: 가장자리에만 두고, 나머지 화면은 건드리지 않는다 */
    .ctl {
      position: fixed; z-index: 31; appearance: none; border: 0; cursor: pointer;
      color: #fff; background: rgba(0, 0, 0, .55); -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px); border-radius: 999px; font-weight: 600; display: none;
    }
    #sound-btn {
      top: calc(12px + env(safe-area-inset-top));
      left: 12px; width: 44px; height: 44px; padding: 10px; line-height: 1;
    }
    #close-btn {
      top: calc(12px + env(safe-area-inset-top)); left: 12px;
      width: 44px; height: 44px; font-size: 17px; line-height: 1;
    }
    #pin-btn {
      left: 50%; transform: translateX(-50%);
      bottom: calc(24px + env(safe-area-inset-bottom));
      padding: 12px 22px; font-size: 15px;
    }
    body.started #sound-btn { display: block; }
    body.tracking:not(.pinned) #pin-btn { display: block; }
    body.pinned #close-btn { display: block; left:64px; }

    /* 계속 보기: 보던 영상을 전체화면으로 승격 */
    #pinned { position: fixed; inset: 0; z-index: 30; display: none; background: #000; }
    body.pinned #pinned { display: block; }
    #pinned video { width: 100%; height: 100%; object-fit: contain; background: #000; }
    /* 음악은 보여줄 화면이 없으므로 재생 카드를 대신 띄운다 */
    #pinned-art {
      display: none; position: absolute; inset: 0;
      align-items: center; justify-content: center; font-size: 96px;
    }
    body.pinned.audio #pinned-art { display: flex; }
    #pinned audio {
      position: absolute; left: 50%; bottom: 14%; transform: translateX(-50%);
      width: min(88%, 420px);
    }

    #camera-prompt {
      display:none; position:fixed; left:20px; right:20px;
      bottom:calc(24px + env(safe-area-inset-bottom)); z-index:10;
      text-align:center; color:#fff; font-size:14px; line-height:1.6;
      pointer-events:none; text-shadow:0 1px 5px #000;
    }
    body.started:not(.tracking):not(.pinned) #camera-prompt {display:block;}
    [hidden] {display:none!important;}
    #library-btn {
      top:calc(12px + env(safe-area-inset-top)); right:12px;
      width:44px; height:44px; padding:10px; display:block;
    }
    .ctl svg {display:block;width:24px;height:24px;}
    .ctl:focus-visible {outline:2px solid #fff;outline-offset:3px;}
    #splash .hint {max-width:100%;white-space:pre-line;}
    dialog {box-sizing:border-box;border:0;border-radius:18px;width:min(760px,calc(100vw - 24px));max-height:84dvh;padding:18px;color:#111;box-shadow:0 12px 50px #0008;}
    dialog::backdrop {background:#000b;}
    .library-top {display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;background:#fff;z-index:3;padding-bottom:12px;}
    .library-top h2 {margin:0;font-size:22px;}
    dialog button {cursor:pointer;}
    #library-close {display:grid;place-items:center;width:44px;height:44px;padding:10px;border:0;background:transparent;color:#111;border-radius:50%;}
    #library-close svg {display:block;width:24px;height:24px;}
    #figure-list {display:grid;grid-template-columns:1fr;gap:18px;}
    .figure-card {position:relative;min-width:0;border:0;border-radius:0;overflow:hidden;background:#fff;}
    .figure-visual {position:relative;width:100%;background:#f5f5f5;}
    .figure-poster {display:block;position:relative;width:100%;border:0;padding:0;border-radius:0;background:transparent;}
    .figure-visual img {display:block;width:100%;height:auto;}
    .figure-visual video {display:block;width:100%;height:auto;object-fit:contain;background:#000;}
    .figure-visual audio {position:absolute;left:0;bottom:0;width:100%;height:44px;}
    .figure-status {position:absolute;top:6px;left:6px;right:6px;margin:0;padding:7px;border-radius:7px;background:#fffffff0;font-size:12px;line-height:1.4;pointer-events:none;}
    .figure-status:empty {display:none;}
    .a-enter-vr, .a-enter-ar { display: none !important; }
  </style>
</head>
<body>
  <div id="message"></div>

  <div id="splash">
    <div class="hint" id="splash-hint">불러오는 중…</div>
    <button id="start-btn" style="display:none">카메라 시작</button>
  </div>

  <button id="library-btn" class="ctl" data-open-library aria-label="갤러리">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
      <rect x="3" y="3" width="18" height="18" rx="3" />
      <circle cx="8.5" cy="8.5" r="1.5" />
      <path d="m3 17 5-5 4 4 3-3 6 6" />
    </svg>
  </button>
  <dialog id="figure-library" aria-labelledby="library-title">
    <div class="library-top"><h2 id="library-title">갤러리</h2><button id="library-close" aria-label="갤러리 닫기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="m6 6 12 12M18 6 6 18" /></svg></button></div>
    <div id="figure-list"></div>
  </dialog>
  <div id="scene-root"></div>
  <div id="camera-prompt">카메라로 사진을 인식시키세요</div>
  <div id="media-status" role="status" style="position:fixed;bottom:100px;left:16px;right:16px;text-align:center;color:white;background:#000b;border-radius:12px;padding:12px;z-index:30;display:none;pointer-events:none"></div>

  <div id="pinned"><div id="pinned-art">🎵</div></div>
  <button id="sound-btn" class="ctl" aria-label="소리 끄기" aria-pressed="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
      <path d="M11 4 6 8H3v8h3l5 4Z" fill="currentColor" stroke="none" />
      <path data-sound-waves d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14" />
      <path data-sound-muted d="m15 9 6 6m0-6-6 6" hidden />
    </svg>
  </button>
  <button id="close-btn" class="ctl" aria-label="닫고 카메라로 돌아가기">✕</button>
  <button id="pin-btn" class="ctl">계속 보기</button>

  <script>
    // 여러 스크립트가 공유하는 상태 (모듈 스크립트에서도 접근한다)
    window.ARState = { pinned: null, home: null, soundOn: true };

    // 타깃을 찾으면 영상 재생(소리 재생이 막히면 무음으로라도), 놓치면 일시정지.
    // A-Frame 컴포넌트는 씬이 주입되기 전에 미리 등록해 둔다.
    AFRAME.registerComponent("ar-video", {
      schema: { video: { type: "selector" } },
      init() {
        // 영상 평면은 '도판'이 아니라 '영상' 비율을 따라야 한다.
        // 실제 영상 크기는 메타데이터가 로드돼야 알 수 있으므로 그때 맞춘다.
        // (가로폭은 도판 폭에 맞추고, 높이만 영상 비율대로 정한다)
        const media = this.data.video;
        const plane = this.el.querySelector("a-video");
        if (plane && media && media.tagName === "VIDEO") {
          const fit = () => {
            if (!media.videoWidth) return;
            plane.setAttribute("height", (media.videoHeight / media.videoWidth).toFixed(4));
          };
          fit();                                        // 이미 로드된 경우
          media.addEventListener("loadedmetadata", fit); // 아직이면 로드될 때
        }

        this.el.addEventListener("targetFound", async () => {
          const v = this.data.video;
          v.dataset.onTarget = "1";
          document.body.classList.add("tracking");
          document.getElementById("pin-btn").textContent =
            v.tagName === "AUDIO" ? "계속 듣기" : "계속 보기";
          // '계속 보기'로 띄운 영상은 카메라가 흔들려도 AR이 건드리지 않는다
          if (v === window.ARState.pinned || window.ARState.manual) return;
          const status = document.getElementById('media-status');
          try {
            status.textContent = '영상·음원을 불러오는 중…'; status.style.display = '';
            await window.ARState.mediaLoader.ensure(v);
            if (window.ARState.manual || !v.dataset.onTarget && v !== window.ARState.pinned) return;
            status.style.display = 'none';
            v.muted = !window.ARState.soundOn;
            v.play().catch(() => { v.muted = true; v.play().catch(() => { status.textContent = '화면을 터치하면 재생됩니다.'; status.style.display = ''; }); });
          } catch(e) { if(v.dataset.onTarget || v === window.ARState.pinned) {status.textContent=e.message;status.style.display='';} }
        });
        this.el.addEventListener("targetLost", () => {
          const v = this.data.video;
          delete v.dataset.onTarget;
          document.body.classList.remove("tracking");
          if (v === window.ARState.pinned || window.ARState.manual) return;
          v.pause();
          if (!window.ARState.pinned) document.getElementById("media-status").style.display="none";
        });
      },
    });
  </script>

  <script type="module">
    const $ = (sel) => document.querySelector(sel);
    const showMessage = (text) => {
      $("#splash").style.display = "none";
      const m = $("#message");
      m.style.display = "flex";
      m.textContent = text;
    };
    const escAttr = (s) => String(s).replace(/"/g, "&quot;");

    import { installCameraAssist, selectedTarget, cameraErrorMessage } from './camera-assist.js';
    import { mountLibrary } from './viewer-library.js';
    import { createMediaLoader } from './media-loader.js';
    import { readManifest, assetUrl, loadMindUrl } from './content-store.js';
    let manifest;
    try { manifest = await readManifest(); }
    catch (e) { showMessage(e.message); throw e; }
    const publicUrl = assetUrl;
    const rows = manifest.targets.filter(r => r.mind_index !== null).sort((a,b) => a.mind_index-b.mind_index);
    if (!rows.length) {
      showMessage("아직 등록된 도판이 없습니다. 관리자 페이지에서 이미지를 추가한 뒤 ‘발행’해 주세요.");
      throw new Error("등록된 타깃 없음");
    }
    installCameraAssist(AFRAME);
    const S = window.ARState;
    S.mediaLoader = createMediaLoader({isProtected: media => !!media.dataset.onTarget || S.pinned === media || S.manualMedia === media});
    window.addEventListener('pagehide', () => S.mediaLoader.clear());
    const selected = new URL(location.href).searchParams.get('figure');
    mountLibrary({rows,assetUrl:publicUrl,loader:S.mediaLoader,state:S});

    // 재생 파일이 음악인지 영상인지는 확장자로 판별한다 (DB 변경 불필요)
    const isAudio = (path) => /\.(mp3|m4a|aac|wav|ogg|oga|opus|flac|weba)$/i.test(path);

    // 음악일 때 도판 위에 띄우는 재생 표시.
    // 글꼴·이미지에 의존하지 않도록 도형만으로 만든 이퀄라이저 막대.
    const audioIndicator = (h) => {
      const bar = (x, to, dur) =>
        `<a-box position="${x} 0 0.01" width="0.05" height="0.08" depth="0.004" color="#fff"
                animation="property: scale; to: 1 ${to} 1; dir: alternate; loop: true; dur: ${dur}; easing: easeInOutSine"></a-box>`;
      return `<a-plane position="0 0 0" width="1" height="${h}" color="#000" opacity="0.45"></a-plane>
        ${bar(-0.1, 2.6, 520)}
        ${bar(0, 4, 700)}
        ${bar(0.1, 3.2, 610)}`;
    };

    // 씬 구성
    const assets = rows.map((r, i) => {
      const src = escAttr(publicUrl(r.video_path));
      // preload는 metadata까지만. auto로 두면 도판 수만큼(예: 18개) 영상을
      // 한꺼번에 내려받아 폰이 버티지 못한다. 실제 파일은 인식된 뒤에 받는다.
      return isAudio(r.video_path)
        ? `<audio id="vid${i}" data-src="${src}" preload="none" loop crossorigin="anonymous"></audio>`
        : `<video id="vid${i}" data-src="${src}" preload="none" loop playsinline webkit-playsinline crossorigin="anonymous"></video>`;
    }).join("\n      ");

    const entities = rows.map((r, i) => {
      const h = Number(r.aspect || 1).toFixed(4);
      const content = isAudio(r.video_path)
        ? audioIndicator(h)
        : `<a-video src="#vid${i}" position="0 0 0" width="1" height="${h}"></a-video>`;
      return `<a-entity mindar-image-target="targetIndex: ${r.mind_index}" ar-video="video: #vid${i}">
        ${content}
      </a-entity>`;
    }).join("\n      ");

    const sceneHTML = mindUrl => `
    <a-scene mindar-image="imageTargetSrc: ${escAttr(mindUrl)}; autoStart: true; maxTrack: 1; uiLoading: no; uiError: no; uiScanning: no; warmupTolerance: 2; missTolerance: 12"
             color-space="sRGB" renderer="colorManagement: true" embedded
             vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-assets timeout="1">
      ${assets}
      </a-assets>
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
      ${entities}
    </a-scene>`;

    // ── 소리: 상태를 한 곳에서 관리한다.
    // (자동 해제가 사용자의 선택을 덮어쓰지 않도록 항상 이 상태를 따른다)
    const setSound = (on) => {
      S.soundOn = on;
      for (const v of document.querySelectorAll("a-assets video, a-assets audio, #pinned video, #pinned audio, #figure-list video, #figure-list audio")) v.muted = !on;
      $("#sound-btn").setAttribute('aria-label', on ? '소리 끄기' : '소리 켜기');
      $("#sound-btn").setAttribute('aria-pressed', String(on));
      $("[data-sound-waves]").toggleAttribute('hidden', !on);
      $("[data-sound-muted]").toggleAttribute('hidden', on);
    };
    $("#sound-btn").addEventListener("click", () => setSound(!S.soundOn));

    // iOS 등은 사용자의 조작이 있어야 소리가 난다.
    // 예전에는 첫 터치에서 모든 영상을 재생해 잠금을 풀었는데, 도판이 많으면
    // 그 수만큼 영상을 동시에 받아버려 폰이 멈춘다.
    // 그래서 '지금 인식 중인' 영상 하나만 소리를 켠다.
    const unlock = () => {
      if (S.manual) return;
      const v = document.querySelector("a-assets [data-on-target]");
      if (v && S.soundOn && v.muted) {
        v.muted = false;
        v.play().then(() => $("#media-status").style.display="none").catch(() => {});
      }
    };

    // ── 계속 보기: 보던 영상을 그대로 전체화면으로 승격한다.
    // 새 요소를 만들지 않고 같은 요소를 옮기므로 재버퍼링도, 재다운로드도 없다.
    // (요소를 옮기면 일부 브라우저가 재생을 끊으므로 위치를 복원하고 다시 재생한다)
    const moveKeepingPlayback = (v, parent) => {
      const t = v.currentTime;
      parent.appendChild(v);
      if (Math.abs(v.currentTime - t) > 0.05) v.currentTime = t;
      v.muted = !S.soundOn;
    };

    $("#pin-btn").addEventListener("click", () => {
      const v = document.querySelector("a-assets [data-on-target]");
      if (!v || S.pinned) return;
      S.pinned = v;
      S.home = v.parentNode;
      v.setAttribute("controls", "");        // 전체화면에서는 일시정지·탐색이 가능하게
      moveKeepingPlayback(v, $("#pinned"));
      document.body.classList.add("pinned");
      document.body.classList.toggle("audio", v.tagName === "AUDIO");
      v.play().catch(() => {});
    });

    $("#close-btn").addEventListener("click", () => {
      const v = S.pinned;
      if (!v) return;
      v.removeAttribute("controls");
      moveKeepingPlayback(v, S.home);
      S.pinned = null;
      document.body.classList.remove("pinned", "audio");
      // 닫는 순간 도판이 아직 보이고 있으면 이어서 재생, 아니면 정지
      if (v.dataset.onTarget) v.play().catch(() => {}); else v.pause();
    });

    const startAR = async () => {
      const button = $("#start-btn"); button.disabled = true;
      $("#splash-hint").textContent = '도표 인식 데이터를 준비하는 중…\n처음에는 잠시 걸릴 수 있습니다.';
      try {
        const mindUrl = await loadMindUrl(manifest);
        $("#scene-root").innerHTML = sceneHTML(mindUrl);
        const scene = $("#scene-root a-scene");
        scene.addEventListener('arReady', () => {
          const index=selectedTarget(rows,selected);
          scene.systems['mindar-image-system'].switchTarget(index);
          $("#splash").style.display='none';document.body.classList.add('started');
        });
        scene.addEventListener('arError', e => {
          $("#splash-hint").textContent=e.detail?.error==='TRACKING_FAIL'?'인식 데이터를 시작하지 못했습니다. 도표 목록에서 영상을 재생하거나 새로고침해 주세요.':cameraErrorMessage(e.detail?.cause);
          button.textContent='새로고침 후 다시 시도';button.disabled=false;button.onclick=()=>location.reload();
        });
        setSound(true);document.addEventListener('pointerdown',unlock);
      } catch(e) {
        $("#splash-hint").textContent=e.message;button.disabled=false;button.textContent='다시 시도';button.onclick=startAR;
      }
    };

    // 카메라·소리 시작은 사용자 제스처가 있어야 안정적(iOS). 버튼 한 번으로 시작.
    $("#splash-hint").textContent = "버튼을 누르면 카메라가 켜지고\n도판 인식이 시작됩니다.";
    const btn = $("#start-btn");
    btn.style.display = "";
    btn.onclick = startAR;
  </script>
</body>
</html>
